    function showToast(message) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'bg-slate-900 text-white text-xs sm:text-sm font-semibold px-4 py-3 rounded-2xl shadow-xl flex items-center gap-2 border border-slate-800 pointer-events-auto transform transition-all duration-300 translate-y-2 opacity-0';
      toast.innerHTML = `<i data-lucide="sparkles" class="w-4 h-4 text-emerald-400 shrink-0"></i><span>${message}</span>`;
      container.appendChild(toast);
      lucide.createIcons();
      
      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    function calculateScore(votes = {}) {
      return Object.values(votes).reduce((acc, val) => acc + val, 0);
    }

    function login(email, password) {
      const cleanEmail = (email || '').trim().toLowerCase();
      const registeredUser = state.users.find(u => u.email.toLowerCase() === cleanEmail);

      if (registeredUser && registeredUser.status === 'inactive') {
        showToast('Acesso bloqueado: Este usuário está Inativo.');
        return;
      }

      if (cleanEmail === 'adrmin@cm.com.br' || cleanEmail === 'admin@cm.com.br' || (registeredUser && registeredUser.role === 'admin')) {
        state.currentUser = {
          email: registeredUser ? registeredUser.email : 'adrmin@cm.com.br',
          name: registeredUser ? registeredUser.name : 'Administrador Casa Magalhães',
          role: 'admin',
          unit: 'P&D Casa Magalhães'
        };
        showToast('Bem-vindo, Administrador Casa Magalhães!');
      } else {
        state.currentUser = {
          email: cleanEmail || 'usuario@cm.com.br',
          name: registeredUser ? registeredUser.name : (cleanEmail === 'usuario@cm.com.br' ? 'Supermercado Parceiro CM' : cleanEmail.split('@')[0]),
          role: 'user',
          unit: registeredUser ? `CNPJ: ${registeredUser.cnpj}` : 'Loja Matriz - Supermercado Modelo'
        };
        showToast('Bem-vindo ao Minhas Ideias na CM!');
      }
      state.activeTab = 'board';
      renderApp();
    }

    function logout() {
      state.currentUser = null;
      state.selectedIdeaDetails = null;
      state.commentsDrawerIdea = null;
      renderApp();
    }

    function handleVote(ideaId, value) {
      if (!state.currentUser) return;
      if (state.currentUser.role === 'admin') {
        showToast('Administradores possuem permissão apenas de visualização dos votos.');
        return;
      }

      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;

      const currentVote = idea.votes[state.currentUser.email];
      if (currentVote === value) {
        delete idea.votes[state.currentUser.email];
      } else {
        idea.votes[state.currentUser.email] = value;
      }

      if (state.selectedIdeaDetails && state.selectedIdeaDetails.id === ideaId) {
        state.selectedIdeaDetails = { ...idea };
      }

      renderApp();
    }

    function handleAddComment(ideaId) {
      if (state.currentUser?.role === 'admin') {
        showToast('Administradores estão em modo de somente leitura para comentários.');
        return;
      }
      if (!state.commentText.trim()) return;

      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;

      const newComment = {
        id: `comm-${Date.now()}`,
        userName: state.currentUser.name,
        userEmail: state.currentUser.email,
        text: state.commentText.trim(),
        date: new Date().toISOString().split('T')[0],
        attachmentName: state.commentFileName || null
      };

      idea.comments.push(newComment);
      state.commentText = '';
      state.commentFileName = '';

      if (state.selectedIdeaDetails && state.selectedIdeaDetails.id === ideaId) {
        state.selectedIdeaDetails = { ...idea };
      }
      if (state.commentsDrawerIdea && state.commentsDrawerIdea.id === ideaId) {
        state.commentsDrawerIdea = { ...idea };
      }

      showToast('Comentário registrado com sucesso!');
      renderApp();
    }

    function movePipeline(ideaId, nextStatus) {
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;
      idea.status = nextStatus;
      showToast(`Demanda atualizada para: ${getStatusLabel(nextStatus)}`);
      renderApp();
    }

    function confirmDelivery(ideaId, build) {
      if (!build.trim()) {
        showToast('Por favor, informe a Build ou versão em que a demanda foi liberada.');
        return;
      }
      const idea = state.ideas.find(i => i.id === ideaId);
      if (!idea) return;
      idea.status = 'delivered';
      idea.deliveredBuild = build.trim();
      state.completingIdea = null;
      state.buildNumberInput = '';
      showToast(`Demanda concluída e disponibilizada na ${idea.deliveredBuild}!`);
      renderApp();
    }

    function getStatusLabel(status) {
      const map = {
        pending_review: 'Em Análise CM',
        voting: 'Em Votação Aberta',
        in_immersion: 'Em Imersão',
        in_development: 'Em Desenvolvimento',
        in_validation: 'Em Validação',
        in_pilot: 'Em Piloto',
        delivered: 'Entregue na Versão',
        merged: 'Agrupada',
        rejected: 'Recusada'
      };
      return map[status] || status;
    }

    function getStatusBadgeClass(status) {

        voting: 'bg-emerald-50 text-emerald-700 border-emerald-200',
        in_immersion: 'bg-sky-50 text-sky-700 border-sky-200',
        in_development: 'bg-indigo-50 text-indigo-700 border-indigo-200',
        in_validation: 'bg-purple-50 text-purple-700 border-purple-200',
        in_pilot: 'bg-amber-50 text-amber-800 border-amber-300',
        delivered: 'bg-teal-50 text-teal-700 border-teal-200',
        merged: 'bg-purple-50 text-purple-700 border-purple-200',
        rejected: 'bg-rose-50 text-rose-700 border-rose-200'
      };
      return map[status] || 'bg-slate-50 text-slate-600 border-slate-200';
    }

    function getFilteredIdeas() {
      return state.ideas.filter(idea => {
        if (state.statusTab === 'disponiveis') {
          if (idea.status !== 'voting') return false;
        } else if (state.statusTab === 'desenvolvimento') {
          if (!['pending_review', 'in_immersion', 'in_development', 'in_validation', 'in_pilot'].includes(idea.status)) {
            return false;
          }
        } else if (state.statusTab === 'entregues') {
          if (idea.status !== 'delivered') return false;
        }

        if (state.selectedProduct !== 'TODOS' && idea.product !== state.selectedProduct) return false;

        if (state.selectedCategory !== 'TODOS') {
          const catFilter = state.selectedCategory.toLowerCase();
          const ideaCat = (idea.category || '').toLowerCase();
          if (!ideaCat.includes(catFilter) && !catFilter.includes(ideaCat)) {
            return false;
          }
        }

        if (state.searchQuery.trim()) {
          const query = state.searchQuery.toLowerCase();
          const matchTitle = idea.title.toLowerCase().includes(query);
          const matchPain = idea.painDescription.toLowerCase().includes(query);
          const matchWorkaround = idea.currentWorkaround.toLowerCase().includes(query);
          const matchCategory = (idea.category || '').toLowerCase().includes(query);
          if (!matchTitle && !matchPain && !matchWorkaround && !matchCategory) return false;
        }
        return true;
      });
    }

    function openUserModal(userId = null) {
      state.editingUserId = userId;
      state.userModalOpen = true;
      renderApp();
    }

    function closeUserModal() {
      state.editingUserId = null;
      state.userModalOpen = false;
      renderApp();
    }

    function handleUserSearch(val) {
      state.userSearchQuery = val;
      renderApp();
    }

    function setUserStatusFilter(status) {
      state.userStatusFilter = status;
      renderApp();
    }

    function handleCnpjMask(input) {
      let value = input.value.replace(/\D/g, '');
      if (value.length > 14) value = value.substring(0, 14);

      if (value.length > 12) {
        value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{1,2})$/, '$1.$2.$3/$4-$5');
      } else if (value.length > 8) {
        value = value.replace(/^(\d{2})(\d{3})(\d{3})(\d{1,4})$/, '$1.$2.$3/$4');
      } else if (value.length > 5) {
        value = value.replace(/^(\d{2})(\d{3})(\d{1,3})$/, '$1.$2.$3');
      } else if (value.length > 2) {
        value = value.replace(/^(\d{2})(\d{1,3})$/, '$1.$2');
      }
      input.value = value;
    }

    function toggleUserStatus(userId) {
      const user = state.users.find(u => u.id === userId);
      if (!user) return;

      if (state.currentUser && state.currentUser.email === user.email) {
        showToast('Não é permitido inativar seu próprio usuário conectado!');
        return;
      }

      user.status = user.status === 'active' ? 'inactive' : 'active';
      showToast(`Usuário ${user.name} agora está ${user.status === 'active' ? 'Ativo' : 'Inativo'}.`);
      renderApp();
    }

    function handleSaveUser(e) {
      e.preventDefault();
      const name = document.getElementById('modal-user-name').value.trim();
      const cnpj = document.getElementById('modal-user-cnpj').value.trim();
      const email = document.getElementById('modal-user-email').value.trim().toLowerCase();
      const role = document.getElementById('modal-user-role').value;
      const status = document.getElementById('modal-user-status').value;

      if (!name || !cnpj || !email) {
        showToast('Por favor, preencha todos os campos obrigatórios!');
        return;
      }

      if (state.editingUserId) {
        const user = state.users.find(u => u.id === state.editingUserId);
        if (user) {
          user.name = name;
          user.cnpj = cnpj;
          user.email = email;
          user.role = role;
          user.status = status;
          showToast(`Usuário ${name} atualizado com sucesso!`);
        }
      } else {
        const emailExists = state.users.some(u => u.email.toLowerCase() === email);
        if (emailExists) {
          showToast('Já existe um usuário cadastrado com este e-mail.');
          return;
        }

        const newUser = {
          id: `usr-${Date.now()}`,
          name: name,
          cnpj: cnpj,
          email: email,
          role: role,
          status: status,
          createdAt: new Date().toISOString().split('T')[0]
        };
        state.users.unshift(newUser);
        showToast(`Usuário ${name} cadastrado com sucesso!`);
      }

      closeUserModal();
    }

    function executeMerge() {
      const selectEl = document.getElementById('select-merge-target');
      const targetId = selectEl ? selectEl.value : '';
      if (!targetId || !state.ideaToMerge) {
        showToast('Por favor, selecione uma demanda destino para agrupar.');
        return;
      }

      state.ideaToMerge.status = 'merged';
      state.ideaToMerge.mergedIntoId = targetId;

      const targetIdea = state.ideas.find(i => i.id === targetId);
      if (targetIdea) {
        targetIdea.comments.push({
          id: `merge-${Date.now()}`,
          userName: 'Sistema (Agrupamento)',
          userEmail: 'sistema@cm.com.br',
          text: `A ideia "${state.ideaToMerge.title}" foi agrupada a esta demanda por ter o mesmo escopo operacional.`,
          date: new Date().toISOString().split('T')[0]
        });
      }

      state.ideaToMerge = null;
      showToast('Ideias agrupadas com sucesso!');
      renderApp();
    }

    function approveIdea(id) {
      const idea = state.ideas.find(i => i.id === id);
      if (idea) {
        idea.status = 'voting';
        showToast('Ideia aprovada e liberada para votação pública!');
        renderApp();
      }
    }

    function rejectIdea(id) {
      const idea = state.ideas.find(i => i.id === id);
      if (idea) {
        idea.status = 'rejected';
        showToast('Ideia recusada na triagem.');
        renderApp();
      }
    }

          `).join('');
          lucide.createIcons();
        }

    }

      const form = document.getElementById('login-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = document.getElementById('input-email').value;
          const pass = document.getElementById('input-password').value;
          login(email, pass);
        });
      }

      const btnUser = document.getElementById('btn-shortcut-user');
      if (btnUser) {
        btnUser.addEventListener('click', () => {
          login('usuario@cm.com.br', '123456');
        });
      }

      const btnAdmin = document.getElementById('btn-shortcut-admin');
      if (btnAdmin) {
        btnAdmin.addEventListener('click', () => {
          login('adrmin@cm.com.br', '123456');
        });
      }
    }

    function attachInteractiveEvents() {
      const newIdeaForm = document.getElementById('new-idea-form');
      if (newIdeaForm) {
        newIdeaForm.addEventListener('submit', (e) => {
          e.preventDefault();
          const title = document.getElementById('form-title').value;
          const product = document.getElementById('form-product').value;
          const category = document.getElementById('form-category').value;
          const pain = document.getElementById('form-pain').value;
          const workaround = document.getElementById('form-workaround').value;

          if (!title.trim() || !pain.trim() || !workaround.trim()) {
            showToast('Por favor, preencha todos os campos obrigatórios!');
            return;
          }

          const createdIdea = {
            id: `ideia-${Date.now()}`,
            title: title.trim(),
            product: product,
            category: category,
            company: state.currentUser.unit || 'Supermercado Varejista',
            authorName: state.currentUser.name,
            authorEmail: state.currentUser.email,
            createdAt: new Date().toISOString().split('T')[0],
            cycle: state.activeCycle,
            painDescription: pain.trim(),
            currentWorkaround: workaround.trim(),
            attachments: state.newFiles.map(f => ({
              name: f.name,
              size: `${(f.size / (1024 * 1024)).toFixed(1)} MB`
            })),
            status: 'pending_review',
            votes: {},
            comments: []
          };

          state.ideas.unshift(createdIdea);
          state.newFiles = [];
          state.activeTab = 'board';
          showToast('Demanda submetida com sucesso! Em análise pela equipe Casa Magalhães.');
          renderApp();
        });
      }
    }

    // Inicialização da aplicação no carregamento
    window.addEventListener('DOMContentLoaded', () => {
      renderApp();
    });
  </script>
</body>
</html>
